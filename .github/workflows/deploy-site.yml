# What: Deploys the AI Club problem site to Vercel production when main changes the site or its content.
# How: Installs, runs the full repo check (format, lint, kit + site tests), builds the static export, then ships it
#      with the Vercel CLI as a prebuilt deployment.
# Objective: Every merge to main that touches problems or the site goes live automatically, and only if checks pass.
name: Deploy problem site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "club-agent/problems/**"
      - "club-agent/install/SETUP-GUIDE.md"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          npm ci --prefix site

      - name: Check (format, lint, kit and site tests)
        run: npm run check

      - name: Build the static export
        run: npm run site:build

      - name: Verify the export (pages present, no runtime DiceBear calls)
        run: npm --prefix site exec vitest run tests/build.test.ts

      - name: Install the test browser
        run: npm --prefix site exec playwright install --with-deps chromium

      - name: Smoke, sanity and regression tests (phone, tablet, desktop)
        run: npm run site:e2e

      # Deploys the already-built, already-tested static folder. No build runs on Vercel,
      # so the Vercel project needs no root directory or framework settings.
      - name: Deploy to production
        run: npx --yes vercel@latest deploy site/out --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
